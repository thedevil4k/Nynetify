name: Build & Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── Windows x86-64 ──────────────────────────────
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-fltk
            mingw-w64-x86_64-mpv
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-python-pip

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Convert icon
        run: python -c "from PIL import Image; img=Image.open('Nynetify.png'); img.save('assets/Nynetify.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Bundle yt-dlp
        run: |
          mkdir -p package
          YT_DLP_SRC=$(python -c "import yt_dlp, os; print(os.path.join(os.path.dirname(yt_dlp.__file__), '__main__.exe'))")
          if [ -f "$YT_DLP_SRC" ]; then
            cp "$YT_DLP_SRC" package/yt-dlp.exe
            echo "yt-dlp.exe bundled from $YT_DLP_SRC"
          else
            echo "WARNING: yt-dlp.exe not found at $YT_DLP_SRC"
          fi

      - name: Copy DLL dependencies
        run: |
          mkdir -p package
          cp build/Nynetify.exe package/
          ldd build/Nynetify.exe | while read -r name arrow path addr; do
            if [[ "$path" == /mingw64/bin/* && -f "$path" ]]; then
              cp "$path" package/
              echo "Copied $path to package/"
            fi
          done

      - name: Package portable ZIP
        run: Compress-Archive -Path package\* -DestinationPath Nynetify-x64-portable.zip -Force
        shell: powershell

      - name: Install NSIS
        run: choco install nsis -y
        shell: powershell

      - name: Build NSIS installer
        run: |
          Copy-Item packaging\windows\installer.nsi package\
          Set-Location package
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
              $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
              $makensis = "makensis"
          }
          & $makensis /DARCH=x64 installer.nsi
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-x64
          path: package/Nynetify-*.exe
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-x64-portable
          path: Nynetify-x64-portable.zip
          compression-level: 0

  # ── Windows ARM64 ───────────────────────────────
  windows-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-fltk
            mingw-w64-clang-aarch64-mpv
            mingw-w64-clang-aarch64-python-pillow
            mingw-w64-clang-aarch64-python-pip

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Convert icon
        run: python -c "from PIL import Image; img=Image.open('Nynetify.png'); img.save('assets/Nynetify.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Bundle yt-dlp
        run: |
          mkdir -p package
          YT_DLP_SRC=$(python -c "import yt_dlp, os; print(os.path.join(os.path.dirname(yt_dlp.__file__), '__main__.exe'))")
          if [ -f "$YT_DLP_SRC" ]; then
            cp "$YT_DLP_SRC" package/yt-dlp.exe
            echo "yt-dlp.exe bundled from $YT_DLP_SRC"
          else
            echo "WARNING: yt-dlp.exe not found at $YT_DLP_SRC"
          fi

      - name: Copy DLL dependencies
        run: |
          mkdir -p package
          cp build/Nynetify.exe package/
          ldd build/Nynetify.exe | while read -r name arrow path addr; do
            if [[ "$path" == /clangarm64/bin/* && -f "$path" ]]; then
              cp "$path" package/
              echo "Copied $path to package/"
            fi
          done

      - name: Package portable ZIP
        run: Compress-Archive -Path package\* -DestinationPath Nynetify-arm64-portable.zip -Force
        shell: powershell

      - name: Install NSIS
        run: choco install nsis -y
        shell: powershell

      - name: Build NSIS installer
        run: |
          Copy-Item packaging\windows\installer.nsi package\
          Set-Location package
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
              $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
              $makensis = "makensis"
          }
          & $makensis /DARCH=arm64 installer.nsi
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-arm64
          path: package/Nynetify-*.exe
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-arm64-portable
          path: Nynetify-arm64-portable.zip
          compression-level: 0

  # ── Linux x86-64 (DEB) ──────────────────────────
  linux-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libfltk1.3-dev libmpv-dev python3-pip python3-pil
          pip3 install yt-dlp --break-system-packages

      - name: Convert icon (placeholder for Linux)
        run: python3 -c "from PIL import Image; img=Image.open('Nynetify.png'); img.save('assets/Nynetify.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Package DEB
        run: |
          cd build && cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-deb
          path: build/nynetify-*.deb
          compression-level: 0

  # ── Linux x86-64 (RPM) ──────────────────────────
  linux-rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libfltk1.3-dev libmpv-dev python3-pip python3-pil rpm
          pip3 install yt-dlp --break-system-packages

      - name: Convert icon (placeholder for Linux)
        run: python3 -c "from PIL import Image; img=Image.open('Nynetify.png'); img.save('assets/Nynetify.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Package RPM
        run: |
          cd build && cpack -G RPM

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-rpm
          path: build/nynetify-*.rpm
          compression-level: 0

  # ── Linux i386 (DEB) ──────────────────────────
  linux-deb-32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libfltk1.3-dev:i386 libmpv-dev:i386 python3-pip python3-pil
          pip3 install yt-dlp --break-system-packages

      - name: Convert icon (placeholder for Linux)
        run: python3 -c "from PIL import Image; img=Image.open('Nynetify.png'); img.save('assets/Nynetify.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure 32-bit
        run: cmake -B build32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_C_FLAGS='-m32' -DCMAKE_CXX_FLAGS='-m32'

      - name: Build 32-bit
        run: cmake --build build32

      - name: Package DEB 32-bit
        run: |
          cd build32 && cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-deb-32
          path: build32/nynetify-*.deb
          compression-level: 0

  # ── Linux i386 (RPM) ──────────────────────────
  linux-rpm-32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libfltk1.3-dev:i386 libmpv-dev:i386 python3-pip python3-pil rpm
          pip3 install yt-dlp --break-system-packages

      - name: Convert icon (placeholder for Linux)
        run: python3 -c "from PIL import Image; img=Image.open('Nynetify.png'); img.save('assets/Nynetify.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure 32-bit
        run: cmake -B build32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_C_FLAGS='-m32' -DCMAKE_CXX_FLAGS='-m32'

      - name: Build 32-bit
        run: cmake --build build32

      - name: Package RPM 32-bit
        run: |
          cd build32 && cpack -G RPM

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-rpm-32
          path: build32/nynetify-*.rpm
          compression-level: 0
