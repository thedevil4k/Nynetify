name: Build & Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════
  # Linux 64-bit DEB (via Docker)
  # ═══════════════════════════════════════════════
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t nynetify-deb -f Dockerfile.debian .

      - name: Extract DEB Package
        run: |
          mkdir -p build
          docker run --rm -v $(pwd)/build:/out nynetify-deb cp /app/nynetify-1.0.0-amd64.deb /out/

      - name: Verify DEB
        run: test -f build/nynetify-*.deb && echo "DEB OK" || { echo "DEB NOT FOUND"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-deb
          path: build/nynetify-*.deb
          compression-level: 0

  # ═══════════════════════════════════════════════
  # Linux 64-bit RPM (via Docker)
  # ═══════════════════════════════════════════════
  linux-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t nynetify-rpm -f Dockerfile.fedora .

      - name: Extract RPM Package
        run: |
          mkdir -p build
          docker run --rm -v $(pwd)/build:/out nynetify-rpm cp /app/nynetify-1.0.0-1.x86_64.rpm /out/

      - name: Verify RPM
        run: test -f build/nynetify-*.rpm && echo "RPM OK" || { echo "RPM NOT FOUND"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-rpm
          path: build/nynetify-*.rpm
          compression-level: 0

  # ═══════════════════════════════════════════════
  # Windows x64 (portable ZIP + NSIS installer)
  # ═══════════════════════════════════════════════
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-fltk
            mingw-w64-x86_64-mpv
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-python-pip

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Convert icon
        run: python -c "from PIL import Image; img=Image.open('Nynetify.png'); img.save('assets/Nynetify.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Bundle portable
        run: |
          mkdir -p package
          cp build/Nynetify.exe package/
          # Bundle yt-dlp.exe
          YT_DLP_SRC=$(python -c "import yt_dlp, os; print(os.path.join(os.path.dirname(yt_dlp.__file__), '__main__.exe'))")
          if [ -f "$YT_DLP_SRC" ]; then
            cp "$YT_DLP_SRC" package/yt-dlp.exe
          else
            echo "WARNING: yt-dlp.exe not found, skipping"
          fi
          # Bundle DLLs
          ldd build/Nynetify.exe | while read -r name arrow path addr; do
            if [[ "$path" == /mingw64/bin/* && -f "$path" ]]; then
              cp "$path" package/
            fi
          done
          echo "=== Portable package contents ==="
          ls -la package/

      - name: Package portable ZIP
        run: Compress-Archive -Path package\* -DestinationPath Nynetify-x64-portable.zip -Force
        shell: powershell

      - name: Verify portable ZIP
        run: |
          if [ -f Nynetify-x64-portable.zip ]; then
            echo "Portable ZIP OK ($(ls -lh Nynetify-x64-portable.zip | awk '{print $5}'))"
          else
            echo "Portable ZIP NOT FOUND"
            exit 1
          fi

      - name: Install NSIS
        run: choco install nsis -y
        shell: powershell

      - name: Build NSIS installer
        run: |
          Copy-Item packaging\windows\installer.nsi package\
          Set-Location package
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
              $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
              $makensis = "makensis"
          }
          & $makensis /DARCH=x64 installer.nsi
          Write-Host "=== NSIS installer built ==="
          Get-ChildItem -Filter "Nynetify-*.exe" | Format-Table Name, Length
        shell: powershell

      - name: Verify installer
        run: |
          if ls package/Nynetify-*.exe 2>/dev/null; then
            echo "Installer OK"
          else
            echo "Installer NOT FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-x64
          path: package/Nynetify-*.exe
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-x64-portable
          path: Nynetify-x64-portable.zip
          compression-level: 0

  # ═══════════════════════════════════════════════
  # Windows ARM64 (portable ZIP + NSIS installer)
  # ═══════════════════════════════════════════════
  windows-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-fltk
            mingw-w64-clang-aarch64-mpv
            mingw-w64-clang-aarch64-python-pillow
            mingw-w64-clang-aarch64-python-pip

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Convert icon
        run: python -c "from PIL import Image; img=Image.open('Nynetify.png'); img.save('assets/Nynetify.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Bundle portable
        run: |
          mkdir -p package
          cp build/Nynetify.exe package/
          # Bundle yt-dlp.exe
          YT_DLP_SRC=$(python -c "import yt_dlp, os; print(os.path.join(os.path.dirname(yt_dlp.__file__), '__main__.exe'))")
          if [ -f "$YT_DLP_SRC" ]; then
            cp "$YT_DLP_SRC" package/yt-dlp.exe
          else
            echo "WARNING: yt-dlp.exe not found, skipping"
          fi
          # Bundle DLLs
          ldd build/Nynetify.exe | while read -r name arrow path addr; do
            if [[ "$path" == /clangarm64/bin/* && -f "$path" ]]; then
              cp "$path" package/
            fi
          done
          echo "=== Portable package contents ==="
          ls -la package/

      - name: Package portable ZIP
        run: Compress-Archive -Path package\* -DestinationPath Nynetify-arm64-portable.zip -Force
        shell: powershell

      - name: Verify portable ZIP
        run: |
