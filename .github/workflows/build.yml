name: Build & Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════
  # Linux DEB (native build on Ubuntu)
  # ═══════════════════════════════════════════════
  linux-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config \
            libfltk1.3-dev libmpv-dev mpv python3-pip python3-pil wget

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package DEB
        run: |
          set -e
          mkdir -p pkg/DEBIAN pkg/opt/nynetify/bin pkg/opt/nynetify/lib pkg/usr/bin
          
          # Main binary
          cp build/Nynetify pkg/opt/nynetify/bin/
          
          # mpv binary
          cp /usr/bin/mpv pkg/opt/nynetify/bin/
          
          # mpv libs (non-system only)
          ldd /usr/bin/mpv | grep '=> /' | awk '{print $3}' | while read -r lib; do
            base=$(basename "$lib")
            case "$base" in
              linux-vdso*|ld-linux*|libc.so*|libm.so*|libpthread*|libdl.so*|librt.so*|libstdc++*|libgcc_s*|libz.so*|libzstd*)
                ;;
              *)
                [ -f "$lib" ] && cp -L "$lib" pkg/opt/nynetify/lib/ || true
                ;;
            esac
          done
          
          # Nynetify libs (non-system only)
          ldd build/Nynetify | grep '=> /' | awk '{print $3}' | while read -r lib; do
            base=$(basename "$lib")
            case "$base" in
              linux-vdso*|ld-linux*|libc.so*|libm.so*|libpthread*|libdl.so*|librt.so*|libstdc++*)
                ;;
              *)
                if [ -f "$lib" ] && [ ! -f "pkg/opt/nynetify/lib/$base" ]; then
                  cp -L "$lib" pkg/opt/nynetify/lib/ || true
                fi
                ;;
            esac
          done
          
          # yt-dlp
          wget -q "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" \
            -O pkg/opt/nynetify/bin/yt-dlp || true
          chmod +x pkg/opt/nynetify/bin/yt-dlp
          
          # wrapper
          cp packaging/linux/nynetify.wrapper pkg/opt/nynetify/nynetify
          chmod +x pkg/opt/nynetify/nynetify
          
          # symlink
          ln -s /opt/nynetify/nynetify pkg/usr/bin/nynetify
          
          # control file
          cp packaging/linux/control pkg/DEBIAN/control
          
          # build
          dpkg-deb -b pkg build/nynetify-1.0.0-amd64.deb

      - name: Verify DEB
        run: ls -lh build/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-deb
          path: build/*.deb
          compression-level: 0

  # ═══════════════════════════════════════════════
  # Linux RPM (via Docker on Ubuntu)
  # ═══════════════════════════════════════════════
  linux-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build RPM in Fedora Docker
        run: docker build -t nynetify-rpm -f packaging/linux/Dockerfile.fedora .

      - name: Extract RPM
        run: |
          mkdir -p build
          docker run --rm -v $(pwd)/build:/out nynetify-rpm sh -c "cp /app/*.rpm /out/"

      - name: Verify RPM
        run: ls -lh build/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-rpm
          path: build/*.rpm
          compression-level: 0

  # ═══════════════════════════════════════════════
  # Windows x64 (portable ZIP + NSIS installer)
  # ═══════════════════════════════════════════════
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-fltk
            mingw-w64-x86_64-mpv
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-python-pip

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Convert icon
        run: python -c "from PIL import Image; img=Image.open('Nynetify.png'); img.save('assets/Nynetify.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Bundle portable
        run: |
          mkdir -p package
          cp build/Nynetify.exe package/
          # Bundle yt-dlp.exe
          YT_DLP_SRC=$(python -c "import yt_dlp, os; print(os.path.join(os.path.dirname(yt_dlp.__file__), '__main__.exe'))")
          if [ -f "$YT_DLP_SRC" ]; then
            cp "$YT_DLP_SRC" package/yt-dlp.exe
          else
            echo "WARNING: yt-dlp.exe not found, skipping"
          fi
          # Bundle DLLs
          ldd build/Nynetify.exe | while read -r name arrow path addr; do
            if [[ "$path" == /mingw64/bin/* && -f "$path" ]]; then
              cp "$path" package/
            fi
          done
          echo "=== Portable package contents ==="
          ls -la package/

      - name: Package portable ZIP
        run: Compress-Archive -Path package\* -DestinationPath Nynetify-x64-portable.zip -Force
        shell: powershell

      - name: Verify portable ZIP
        run: |
          if [ -f Nynetify-x64-portable.zip ]; then
            echo "Portable ZIP OK ($(ls -lh Nynetify-x64-portable.zip | awk '{print $5}'))"
          else
            echo "Portable ZIP NOT FOUND"
            exit 1
          fi

      - name: Install NSIS
        run: choco install nsis -y
        shell: powershell

      - name: Build NSIS installer
        run: |
          Copy-Item packaging\windows\installer.nsi package\
          Set-Location package
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
              $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
              $makensis = "makensis"
          }
          & $makensis /DARCH=x64 installer.nsi
          Write-Host "=== NSIS installer built ==="
          Get-ChildItem -Filter "Nynetify-*.exe" | Format-Table Name, Length
        shell: powershell

      - name: Verify installer
        run: |
          if ls package/Nynetify-*.exe 2>/dev/null; then
            echo "Installer OK"
          else
            echo "Installer NOT FOUND"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-x64
          path: package/Nynetify-*.exe
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: Nynetify-x64-portable
          path: Nynetify-x64-portable.zip
          compression-level: 0

  # ═══════════════════════════════════════════════
  # Windows ARM64 (portable ZIP + NSIS installer)
  # ═══════════════════════════════════════════════
  windows-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-fltk
            mingw-w64-clang-aarch64-mpv
            mingw-w64-clang-aarch64-python-pillow
            mingw-w64-clang-aarch64-python-pip

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Convert icon
        run: python -c "from PIL import Image; img=Image.open('Nynetify.png'); img.save('assets/Nynetify.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Bundle portable
        run: |
          mkdir -p package
          cp build/Nynetify.exe package/
          # Bundle yt-dlp.exe
          YT_DLP_SRC=$(python -c "import yt_dlp, os; print(os.path.join(os.path.dirname(yt_dlp.__file__), '__main__.exe'))")
          if [ -f "$YT_DLP_SRC" ]; then
            cp "$YT_DLP_SRC" package/yt-dlp.exe
          else
            echo "WARNING: yt-dlp.exe not found, skipping"
          fi
          # Bundle DLLs
          ldd build/Nynetify.exe | while read -r name arrow path addr; do
            if [[ "$path" == /clangarm64/bin/* && -f "$path" ]]; then
              cp "$path" package/
            fi
          done
          echo "=== Portable package contents ==="
          ls -la package/

      - name: Package portable ZIP
        run: Compress-Archive -Path package\* -DestinationPath Nynetify-arm64-portable.zip -Force
        shell: powershell

